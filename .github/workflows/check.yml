name: Check game
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check
      - run: npm test
      - run: python3 tests/static_check.py
      - name: Browser regression suite in Chrome
        shell: bash
        run: |
          python3 server.py > /tmp/lantern-server.log 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:55603/ >/dev/null; then break; fi
            sleep 0.2
          done
          google-chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --dump-dom --timeout=15000 --virtual-time-budget=5000 'http://127.0.0.1:55603/tests/browser.html?autorun' > /tmp/lantern-browser.html
          python3 - <<'PY'
          from pathlib import Path
          from html import unescape
          text=unescape(Path('/tmp/lantern-browser.html').read_text())
          assert 'COMPLETE · 7 groups · 39 assertions passed' in text, text[:10000]
          assert 'FAIL ·' not in text, text[:10000]
          print('PASS: 7 browser groups, 39 assertions')
          PY
      - run: git diff --check
